name: Job Radar scan

# Collects product roles every morning and commits jobs/data/jobs.json, which the page at /jobs/ reads.
on:
  schedule:
    - cron: '17 5 * * *'   # 06:17 in winter, 07:17 in summer, Barcelona time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scraper/**', '.github/workflows/job-radar.yml']

permissions:
  contents: write

concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the matching engine
        run: node scraper/test/engine.test.js > /dev/null
      - name: Scan sources
        run: node scraper/run.mjs
      - name: Publish results
        run: |
          git config user.name "job-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs/data/jobs.json scraper/companies.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Job Radar: scan $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
