name: Job Radar refresh

on:
  push:
    branches: ['claude/barcelona-job-search-tool-8k211d']
    paths: ['scraper/**', '.github/workflows/job-radar.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-radar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe sources
        run: node scraper/probe.mjs
      - name: Commit data
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jobs/data
          git diff --cached --quiet && exit 0
          git commit -m "Job Radar: data refresh $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
